# The database the test suite and local development run against.
#
#   docker compose up -d
#   export DATABASE_URL="postgresql://chaska:chaska@localhost:5434/chaska?schema=public"
#
# 5434 rather than 5432/5433 so this never collides with a native Postgres
# install (5432) or a chaska dev stack running alongside it (5433).
services:
  postgres:
    # postgis, not plain postgres: delivery zones are polygons and zone lookup
    # is a containment query the database answers.
    image: postgis/postgis:16-3.4
    container_name: chaska-pg
    environment:
      POSTGRES_USER: chaska
      POSTGRES_PASSWORD: chaska
      POSTGRES_DB: chaska
    ports:
      - '5434:5432'
    volumes:
      - chaska-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chaska -d chaska']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  chaska-pgdata:
