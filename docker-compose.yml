# Full local stack: Postgres + backend + frontend, all in Docker.
#
#   docker compose up -d --build
#   Frontend: http://localhost:5173
#   Backend:  http://localhost:5000  (health: /health)
#
# Source is bind-mounted into both app containers, so edits on the host
# reload through nodemon / Vite without a rebuild. Only `docker compose up
# --build` is needed again after a dependency change (package.json).
#
# This duplicates Backend/docker-compose.yml's database (same credentials,
# same port 5434) so the two are interchangeable -- use that one alone when
# only the backend needs to run on the host; use this one for the whole
# stack. Do not run both at once: they'd fight over the chaska-pg container
# name and port 5434.
services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: chaska-pg
    environment:
      POSTGRES_USER: chaska
      POSTGRES_PASSWORD: chaska
      POSTGRES_DB: chaska
    ports:
      - '5434:5432'
    volumes:
      - chaska-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chaska -d chaska']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./Backend
    container_name: chaska-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://chaska:chaska@postgres:5432/chaska?schema=public
      NODE_ENV: development
      PORT: 5000
      HOST: 0.0.0.0
      SOCKET_PORT: 5001
      # Loaded from Backend/.env for everything else (JWT secrets, SMS,
      # Razorpay, Firebase, ...) -- only the values above are overridden to
      # point at the "postgres" service instead of localhost.
    env_file:
      - ./Backend/.env
    ports:
      - '5000:5000'
      - '5001:5001'
    volumes:
      - ./Backend:/app
      - backend-node-modules:/app/node_modules
    command: sh -c "npx prisma migrate deploy && npx prisma generate && npm run dev"

  frontend:
    build: ./Frontend
    container_name: chaska-frontend
    depends_on:
      - backend
    environment:
      DEV_API_PROXY_TARGET: http://backend:5000
    ports:
      - '5173:5173'
    volumes:
      - ./Frontend:/app
      - frontend-node-modules:/app/node_modules

volumes:
  chaska-pgdata:
  backend-node-modules:
  frontend-node-modules:
