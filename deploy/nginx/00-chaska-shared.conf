# Shared http-context config for the chaska vhosts.
#
# Symlinked into sites-enabled alongside the per-host files. Loaded exactly
# once: upstreams, maps and limit zones are http-context directives, and
# defining the same zone name twice is a startup error.

upstream chaska_api {
    server 127.0.0.1:5000;
    keepalive 64;
}
upstream chaska_socket {
    server 127.0.0.1:5001;
    keepalive 64;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

limit_req_zone  $binary_remote_addr zone=chaska_api_limit:10m rate=25r/s;
limit_conn_zone $binary_remote_addr zone=chaska_perip:10m;
