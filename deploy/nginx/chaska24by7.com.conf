# Customer-facing site — chaska24by7.com and www.chaska24by7.com
#
# Port 80 only; certbot adds TLS and the redirect. One static Vite build;
# react-router owns everything under /.

server {
    listen 80;
    listen [::]:80;
    server_name chaska24by7.com www.chaska24by7.com;

    root /srv/chaska/admin;
    index index.html;

    access_log /var/log/nginx/chaska-www.access.log;
    error_log  /var/log/nginx/chaska-www.error.log;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Uploaded media is stored with relative URLs, so a browser on this host
    # resolves them against this host.
    location /uploads/ {
        alias /srv/chaska/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
