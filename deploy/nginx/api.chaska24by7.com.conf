# Production API — api.chaska24by7.com
#
# Port 80 only, deliberately. Certbot (`--nginx`) reads this block, issues the
# certificate, then adds the `listen 443 ssl` block and the http->https
# redirect itself.
#
# Requires 00-chaska-shared.conf (upstreams, limit zones) to be enabled.

server {
    listen 80;
    listen [::]:80;
    server_name api.chaska24by7.com;

    client_max_body_size 6M;
    keepalive_timeout 65;

    access_log /var/log/nginx/chaska-api.access.log;
    error_log  /var/log/nginx/chaska-api.error.log;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss image/svg+xml;

    location = /health {
        proxy_pass http://chaska_api;
        include /etc/nginx/snippets/chaska-proxy.conf;
        access_log off;
    }

    location = /ready {
        proxy_pass http://chaska_api;
        include /etc/nginx/snippets/chaska-proxy.conf;
        access_log off;
    }

    # Socket.IO runs as its own single process, not in the API cluster.
    location /socket.io/ {
        proxy_pass http://chaska_socket;
        include /etc/nginx/snippets/chaska-proxy.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }

    # Written by the API, served by nginx -- Node never reads them back.
    location /uploads/ {
        alias /srv/chaska/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Cross-Origin-Resource-Policy "cross-origin";
        access_log off;
        try_files $uri =404;
    }

    location /api/ {
        limit_req  zone=chaska_api_limit burst=60 nodelay;
        limit_conn chaska_perip 30;

        proxy_pass http://chaska_api;
        include /etc/nginx/snippets/chaska-proxy.conf;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_busy_buffers_size 64k;
    }

    location / {
        return 404;
    }
}
